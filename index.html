<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FaceLink - Global Collaboration Room</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="#1e1e21">
    <meta name="apple-mobile-web-app-title" content="FaceLink">
    <link rel="apple-touch-icon" href="assets/favicon.png">

    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <main id="join-container" class="fade-in">
        <h1>FaceLink</h1>
        <p class="subtitle">Premium multi-peer video collaboration</p>
        
        <label for="name-input" class="sr-only">Your Name</label>
        <input type="text" id="name-input" placeholder="Your Name" autocomplete="name">
        <div class="divider"></div>
        <button id="create-btn" class="primary-btn">New Meeting</button>
        <div class="or-separator" aria-hidden="true">━ OR ━</div>
        
        <label for="room-input" class="sr-only">Meeting Code</label>
        <input type="text" id="room-input" placeholder="Enter meeting code">
        <button id="join-btn" class="secondary-btn">Join Meeting</button>
    </main>

    <div id="video-interface" class="hidden">
        <header id="room-header">
            <div class="meeting-info">
                <h2>Meeting Code: <span id="room-title"></span></h2>
            </div>
            <button id="copy-btn" aria-label="Copy meeting access link">Copy Join Link</button>
        </header>

        <div id="meeting-body">
            <section id="video-grid" aria-label="Participant Streams"></section>
            
            <aside id="chat-panel" class="hidden" aria-label="In-room messages">
                <div class="chat-header">
                    <h3>In-call messages</h3>
                    <button id="close-chat-btn" aria-label="Close Chat Panel">✕</button>
                </div>
                <div id="chat-messages" aria-live="polite"></div>
                <div id="chat-input-container">
                    <input type="text" id="chat-input" placeholder="Send a message to everyone" aria-label="Chat Message Input">
                    <button id="send-chat-btn" aria-label="Send message">➔</button>
                </div>
            </aside>
        </div>

        <nav id="control-dock" aria-label="Call controls">
            <div class="dock-left">
                <span id="dock-time">FaceLink Live</span>
            </div>
            <div class="dock-center">
                <button id="mic-btn" class="dock-icon" title="Toggle Microphone" aria-label="Mute Microphone">🎤</button>
                <button id="cam-btn" class="dock-icon" title="Toggle Camera" aria-label="Turn off Camera">📷</button>
                <button id="chat-toggle-btn" class="dock-icon" title="Toggle Chat" aria-label="Toggle Side Chat Panel">💬</button>
                <button id="leave-btn" class="dock-icon danger" title="Leave Call" aria-label="Leave Call Session">🛑</button>
            </div>
            <div class="dock-right">
                <span id="participant-count" aria-live="polite">Participants: 1</span>
            </div>
        </nav>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(() => console.log('[PWA] Service worker deployment verified.'))
                    .catch(err => console.error('[PWA] Worker initialisation failure:', err));
            });
        }
    </script>
</body>
</html>
